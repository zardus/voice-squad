# Usage:
#   docker compose up --build
#   SQUAD_CAPTAIN=codex docker compose up --build
#
# Required env vars: ANTHROPIC_API_KEY, OPENAI_API_KEY
# Optional: GH_TOKEN, HOST_HOME_PATH, SQUAD_CAPTAIN (default: claude), VOICE_TOKEN (auto-generated if not set)
#
# HOST_HOME_PATH is the absolute host path to ./home (needed for sibling container bind mounts).
# It is auto-detected if not set.

services:
  workspace:
    build:
      context: src/workspace
    deploy:
      replicas: 0

  captain:
    build:
      context: src/captain
    volumes:
      - ./home:/home/ubuntu
      - sockets:/run/squad-sockets
    environment:
      - ANTHROPIC_API_KEY
      - _ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - _OPENAI_API_KEY
      - GH_TOKEN
      - SQUAD_CAPTAIN=${SQUAD_CAPTAIN:-claude}
      - CAPTAIN_TMUX_SOCKET=/run/squad-sockets/captain-tmux/default
      - SPEAK_SOCKET_PATH=/run/squad-sockets/speak.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tmux -S /run/squad-sockets/captain-tmux/default has-session -t captain 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  voice-server:
    build:
      context: src/voice-server
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      captain:
        condition: service_healthy
    volumes:
      - ./home:/home/ubuntu
      - sockets:/run/squad-sockets
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ANTHROPIC_API_KEY
      - _ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - _OPENAI_API_KEY
      - GH_TOKEN
      - VOICE_TOKEN
      - SQUAD_CAPTAIN=${SQUAD_CAPTAIN:-claude}
      - CAPTAIN_TMUX_SOCKET=/run/squad-sockets/captain-tmux/default
      - PROJECTS_SOCKETS_DIR=/run/squad-sockets/projects
      - SPEAK_SOCKET_PATH=/run/squad-sockets/speak.sock
      - HOST_HOME_PATH
      - SQUAD_WORKSPACE_IMAGE=${COMPOSE_PROJECT_NAME:-squad}-workspace
      - SQUAD_DOCKER_NETWORK=${COMPOSE_PROJECT_NAME:-squad}_default
      - SQUAD_SOCKETS_VOLUME=${COMPOSE_PROJECT_NAME:-squad}_sockets
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  tunnel:
    build:
      context: src/tunnel
    depends_on:
      voice-server:
        condition: service_healthy
    volumes:
      - ./home:/home/ubuntu
    environment:
      - VOICE_TOKEN
      - VOICE_SERVER_ORIGIN=http://voice-server:3000

  pane-monitor:
    build:
      context: src/pane-monitor
    depends_on:
      captain:
        condition: service_healthy
    volumes:
      - sockets:/run/squad-sockets
    environment:
      - CAPTAIN_TMUX_SOCKET=/run/squad-sockets/captain-tmux/default
      - PROJECTS_SOCKETS_DIR=/run/squad-sockets/projects
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-900}
    restart: unless-stopped

volumes:
  sockets:
