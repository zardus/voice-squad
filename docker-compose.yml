# Usage:
#   docker compose up --build
#   SQUAD_OVERSEER=codex docker compose up --build
#
# Required env vars: ANTHROPIC_API_KEY, OPENAI_API_KEY
# Optional: GH_TOKEN, HOST_HOME_PATH, SQUAD_OVERSEER (default: codex), VOICE_TOKEN (auto-generated if not set)
#
# HOST_HOME_PATH is the absolute host path to ./home (needed for sibling container bind mounts).
# It is auto-detected if not set.

services:
  workspace:
    build:
      context: src/workspace
    deploy:
      replicas: 0

  overseer:
    build:
      context: src/overseer
    volumes:
      - ./home:/home/ubuntu
      - sockets:/run/squad-sockets
    environment:
      - ANTHROPIC_API_KEY
      - _ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - _OPENAI_API_KEY
      - GH_TOKEN
      - SQUAD_OVERSEER=${SQUAD_OVERSEER:-codex}
      - OVERSEER_TMUX_SOCKET=/run/squad-sockets/overseer-tmux/default
      - SPEAK_SOCKET_PATH=/run/squad-sockets/speak.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tmux -S /run/squad-sockets/overseer-tmux/default has-session -t overseer 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  hub:
    build:
      context: src/hub
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      overseer:
        condition: service_healthy
    volumes:
      - ./home:/home/ubuntu
      - sockets:/run/squad-sockets
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ANTHROPIC_API_KEY
      - _ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - _OPENAI_API_KEY
      - GH_TOKEN
      - VOICE_TOKEN
      - SQUAD_OVERSEER=${SQUAD_OVERSEER:-codex}
      - OVERSEER_TMUX_SOCKET=/run/squad-sockets/overseer-tmux/default
      - PROJECTS_SOCKETS_DIR=/run/squad-sockets/projects
      - SPEAK_SOCKET_PATH=/run/squad-sockets/speak.sock
      - HOST_HOME_PATH
      - SQUAD_WORKSPACE_IMAGE=${COMPOSE_PROJECT_NAME:-squad}-workspace
      - SQUAD_DOCKER_NETWORK=${COMPOSE_PROJECT_NAME:-squad}_default
      - SQUAD_SOCKETS_VOLUME=${COMPOSE_PROJECT_NAME:-squad}_sockets
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  tunnel:
    build:
      context: src/tunnel
    depends_on:
      hub:
        condition: service_healthy
    volumes:
      - ./home:/home/ubuntu
    environment:
      - VOICE_TOKEN
      - VOICE_SERVER_ORIGIN=http://hub:3000

  pane-monitor:
    build:
      context: src/pane-monitor
    depends_on:
      overseer:
        condition: service_healthy
    volumes:
      - sockets:/run/squad-sockets
    environment:
      - OVERSEER_TMUX_SOCKET=/run/squad-sockets/overseer-tmux/default
      - PROJECTS_SOCKETS_DIR=/run/squad-sockets/projects
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-900}
      - SPEAK_SOCKET_PATH=/run/squad-sockets/speak.sock
    restart: unless-stopped

volumes:
  sockets:
