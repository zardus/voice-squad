# Test overrides — layered on top of docker-compose.yml.
#
# Usage (via test.sh):
#   docker compose -p voice-squad-test -f docker-compose.yml -f docker-compose.test.yml \
#     run --build --rm test-runner
#
# All real services run their real entrypoints with real API keys.
# The only override is swapping ./home for an ephemeral volume.

services:
  captain:
    volumes:
      - test-home:/home/ubuntu
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test-openai-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-test-anthropic-key}

  voice-server:
    volumes:
      - test-home:/home/ubuntu
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test-openai-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-test-anthropic-key}
      HOST_HOME_PATH: /test-home-not-available
      SQUAD_WORKSPACE_IMAGE: ${COMPOSE_PROJECT_NAME:-squad}-workspace
      SQUAD_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-squad}_default
      SQUAD_SOCKETS_VOLUME: ${COMPOSE_PROJECT_NAME:-squad}_sockets

  pane-monitor:
    environment:
      HEARTBEAT_INTERVAL_SECONDS: 5

  tunnel:
    volumes:
      - test-home:/home/ubuntu

  test-runner:
    build:
      context: .
      dockerfile: tests/Dockerfile.test
    depends_on:
      voice-server:
        condition: service_healthy
      pane-monitor:
        condition: service_started
    volumes:
      - test-home:/home/ubuntu
      - sockets:/run/squad-sockets
    environment:
      - VOICE_TOKEN
      - TEST_INTEGRATION=1
      - TEST_CAPTAIN=${TEST_CAPTAIN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-test-openai-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-test-anthropic-key}
      - CAPTAIN_TMUX_SOCKET=/run/squad-sockets/captain-tmux/default
      - PROJECTS_SOCKETS_DIR=/run/squad-sockets/projects
      - SPEAK_SOCKET_PATH=/run/squad-sockets/speak.sock

volumes:
  test-home:
